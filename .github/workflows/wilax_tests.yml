name: wilax tests

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          python -m pip install pyyaml
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli
      - name: Static checks (compose, override, scripts, php lint)
        run: python -I -m unittest discover -s tests -v
