; SLIM: derived from tracked data/conf/phpfpm/php-fpm.d/pools.conf (regenerate with the awk in APPLY.md after upstream merges). Mount over /usr/local/etc/php-fpm.d/z-pools.conf.
; Effect: ondemand workers cost 0 RSS idle; caps 6+6 children (tracked: 15+50). Est. saving 60-150MB. RISK: first request after idle pays spawn latency; >6 concurrent API/IMAP-auth requests queue.
[system-worker]
user = www-data
group = www-data
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 15s
listen = [::]:9001
access.log = /proc/self/fd/2
clear_env = no
catch_workers_output = yes
php_admin_value[memory_limit] = 256M
php_admin_value[disable_functions] = show_source, highlight_file, apache_child_terminate, apache_get_modules, apache_note, apache_setenv, virtual, dl, disk_total_space, posix_getpwnam, posix_getpwuid, posix_mkfifo, posix_mknod, posix_setpgid, posix_setsid, posix_setuid, posix_uname, proc_nice, openlog, syslog, pfsockopen, system, shell_exec, passthru, popen, proc_open, exec, ini_alter, pcntl_exec, proc_close, proc_get_status, proc_terminate, symlink

[web-worker]
user = www-data
group = www-data
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 15s
listen = [::]:9002
access.log = /proc/self/fd/2
clear_env = no
catch_workers_output = yes
php_admin_value[memory_limit] = 512M
php_admin_value[disable_functions] = show_source, highlight_file, apache_child_terminate, apache_get_modules, apache_note, apache_setenv, virtual, dl, disk_total_space, posix_getpwnam, posix_getpwuid, posix_mkfifo, posix_mknod, posix_setpgid, posix_setsid, posix_setuid, posix_uname, proc_nice, openlog, syslog, pfsockopen, system, shell_exec, passthru, popen, proc_open, exec, ini_alter, pcntl_exec, proc_close, proc_get_status, proc_terminate, symlink
